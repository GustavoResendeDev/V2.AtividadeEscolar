# Publica na Cloudflare a cada push na main: testa, atualiza o banco da Supabase e sobe o Worker.
# Segredos do repositório (Settings > Secrets and variables > Actions): veja DEPLOY.md.
name: Deploy na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.URL_SITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Testes
        run: npm test

      - name: Atualiza o banco (schema idempotente + administrador na primeira vez)
        run: npm run migrar
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}

      - name: Publica o Worker (site + API)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Só envia os segredos preenchidos (sem Resend, o site funciona e apenas não manda e-mail).
      - name: Atualiza os segredos do Worker
        run: |
          node -e '
            const nomes = ["DATABASE_URL", "RESEND_API_KEY", "EMAIL_AVISO_PARA"];
            const s = Object.fromEntries(nomes.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("segredos.json", JSON.stringify(s));
            console.log("Segredos:", Object.keys(s).join(", "));'
          npx wrangler secret bulk segredos.json
          rm segredos.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_AVISO_PARA: ${{ secrets.EMAIL_AVISO_PARA }}

      - name: Confere se a API respondeu
        if: vars.URL_SITE != ''
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.URL_SITE }}/api/servicos" > /dev/null
