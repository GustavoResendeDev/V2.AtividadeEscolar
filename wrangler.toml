# Cloudflare Worker: site (public/) + API (/api/*) num lugar só, no plano grátis.
# Deploy: GitHub Actions (.github/workflows/deploy.yml). Segredos: veja DEPLOY.md.
name = "nova-era-barbearia"
main = "server/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# O site publicado sai de dist/ (CSS e JS minificados e versionados), montado por scripts/montar-site.mjs.
[build]
command = "node scripts/montar-site.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Só a API passa pelo Worker; páginas, CSS, imagens e vídeo saem direto da Cloudflare (sem gastar requisições).
run_worker_first = ["/api/*"]

# A API roda ao lado do banco (Supabase em Oregon, aws us-west-2): cada consulta fica a poucos ms.
# As páginas continuam saindo da Cloudflare mais perto de quem acessa.
[placement]
mode = "targeted"
region = "aws:us-west-2"

# Conexões com a Supabase já abertas e reaproveitadas (cache de consultas desligado: a agenda muda o tempo todo).
# Para usar no wrangler dev: CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://...
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "c6f4b18e379f44c6929a6081ba3ac76c"

# Manutenção diária às 03:00 de Brasília (06:00 UTC): anonimização LGPD e limpeza de sessões.
[triggers]
crons = ["0 6 * * *"]

# Remetente do aviso por e-mail (só com domínio verificado no Resend):
# [vars]
# EMAIL_REMETENTE = "Nova Era <avisos@seudominio.com.br>"

[observability]
enabled = true
